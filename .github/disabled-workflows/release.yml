# INACTIVE — GitHub only runs workflows stored in .github/workflows/, so this file does nothing here.
# To enable it:
#   git mv .github/disabled-workflows/release.yml .github/workflows/release.yml
#
# It runs the same scripts as a local release (scripts/release/package.sh and publish.sh).
# Standard GitHub-hosted runners (including macos-26) are free for public repositories.
#
# Tap updates need a fine-grained personal access token with "Contents: read and write" on
# ItsReidar/homebrew-tap, stored as the repository secret TAP_GITHUB_TOKEN. Without it, only the
# GitHub release is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0); the tag v<version> is created at the selected ref"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # package.sh derives the build number from the commit count

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/package.sh --version "$VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brain-md-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Check out tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ItsReidar/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$TAP_TOKEN" ]]; then
            git -C homebrew-tap config user.name "github-actions[bot]"
            git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            scripts/release/publish.sh --version "$VERSION" --tap-dir homebrew-tap --yes
          else
            scripts/release/publish.sh --version "$VERSION" --skip-tap --yes
          fi
